name: Release

# Fabrique CurseurTrainee.exe sur un serveur Windows et le publie dans une release.
# Déclenchement : poussée d'une étiquette "v..." (ex. v1.1.0), ou lancement manuel.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Fabriquer l'exécutable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Calculer l'empreinte SHA-256
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/CurseurTrainee.exe -Algorithm SHA256).Hash.ToLower()
          "sha=$h" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "SHA-256 : $h"

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CurseurTrainee.exe
          body: |
            Traînée lumineuse derrière le curseur, sur tout l'écran Windows.

            **Utilisation** : téléchargez `CurseurTrainee.exe` et double-cliquez dessus. Aucune installation. Une icône apparaît dans la zone de notification : clic gauche pour les réglages.

            **Windows peut afficher « Windows a protégé votre ordinateur »** : le programme n'est pas signé. Cliquez sur « Informations complémentaires », puis « Exécuter quand même ».

            **Empreinte SHA-256** du fichier (pour vérifier qu'il est intact) :
            `${{ steps.hash.outputs.sha }}`

            Vérification : `certutil -hashfile CurseurTrainee.exe SHA256`

      - name: Garder l'exécutable (lancement manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: CurseurTrainee
          path: dist/CurseurTrainee.exe
